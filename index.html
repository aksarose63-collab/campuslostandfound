<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusReclaim – Lost & Found</title>
  <meta name="description"
    content="Report and recover lost items on campus. Join CampusReclaim to help your fellow students find what they've lost.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
</head>

<body>

  <div id="auth-page" class="auth-page">

    <!-- Animated background orbs -->
    <div class="auth-bg">
      <div class="auth-orb auth-orb-1"></div>
      <div class="auth-orb auth-orb-2"></div>
      <div class="auth-orb auth-orb-3"></div>
    </div>

    <div class="auth-container">
      <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
          <div class="auth-logo-icon">🔍</div>
          <h1>CampusReclaim</h1>
          <p>Your campus lost &amp; found platform</p>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login">Sign In</button>
          <button class="auth-tab" id="tab-signup">Create Account</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form" id="login-form" autocomplete="on">
          <div class="form-group input-group">
            <label class="form-label" for="login-email">Email</label>
            <span class="input-icon">📧</span>
            <input class="form-input" id="login-email" type="email" placeholder="you@college.edu" required
              autocomplete="email">
          </div>
          <div class="form-group input-group">
            <label class="form-label" for="login-password">Password</label>
            <span class="input-icon">🔒</span>
            <input class="form-input" id="login-password" type="password" placeholder="Enter password" required
              autocomplete="current-password">
          </div>
          <button type="submit" class="auth-submit-btn" id="login-submit">Sign In →</button>
        </form>

        <!-- Signup Form -->
        <form class="auth-form hidden" id="signup-form" autocomplete="on">
          <div class="form-group input-group">
            <label class="form-label" for="signup-username">Username</label>
            <span class="input-icon">👤</span>
            <input class="form-input" id="signup-username" type="text" placeholder="e.g. john_doe" required
              minlength="3" maxlength="30" autocomplete="username">
          </div>
          <div class="form-group input-group">
            <label class="form-label" for="signup-email">Email</label>
            <span class="input-icon">📧</span>
            <input class="form-input" id="signup-email" type="email" placeholder="you@college.edu" required
              autocomplete="email">
          </div>
          <div class="form-row">
            <div class="form-group input-group">
              <label class="form-label" for="signup-password">Password</label>
              <span class="input-icon">🔒</span>
              <input class="form-input" id="signup-password" type="password" placeholder="Min 6 characters" required
                minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group input-group">
              <label class="form-label" for="signup-confirm">Confirm</label>
              <span class="input-icon">✅</span>
              <input class="form-input" id="signup-confirm" type="password" placeholder="Repeat password" required
                autocomplete="new-password">
            </div>
          </div>
          <button type="submit" class="auth-submit-btn" id="signup-submit">Create Account →</button>
        </form>

        <!-- Feature highlights -->
        <div class="auth-features">
          <div class="auth-feature">
            <div class="auth-feature-icon">📍</div>
            <span>Report Items</span>
          </div>
          <div class="auth-feature">
            <div class="auth-feature-icon">🙋</div>
            <span>Claim Items</span>
          </div>
          <div class="auth-feature">
            <div class="auth-feature-icon">🏆</div>
            <span>Earn Points</span>
          </div>
          <div class="auth-feature">
            <div class="auth-feature-icon">🔒</div>
            <span>Secure</span>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/local-db.js?v=2"></script>
  <script src="js/utils.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
</body>

</html>
